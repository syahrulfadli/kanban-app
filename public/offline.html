<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban — sedang offline</title>
    <meta name="theme-color" content="#E6ECF5" />

    <!-- Halaman ini dilayani service worker saat jaringan mati, jadi ia harus
         berdiri sendiri: tidak ada CSS, font, atau gambar dari luar. Temanya
         mengikuti pilihan yang sama dengan aplikasinya (lihat useTheme). -->
    <script>
      (() => {
        let pref = "system";
        try {
          pref = localStorage.getItem("kanban:theme") || "system";
        } catch {}
        const dark =
          pref === "dark" ||
          (pref !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>

    <style>
      :root {
        color-scheme: light;
        --bg: #e6ecf5;
        --ink: #0b1220;
        --muted: #64748b;
        --accent: #0284c7;
      }
      [data-theme="dark"] {
        color-scheme: dark;
        --bg: #08090c;
        --ink: #f3f6fc;
        --muted: #93a0b8;
        --accent: #38bdf8;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.125rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 1.5rem;
        max-width: 28rem;
        font-size: 0.875rem;
        line-height: 1.6;
        color: var(--muted);
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 0.55rem 1.1rem;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
      }
      img {
        width: 56px;
        height: 56px;
        margin-bottom: 1.25rem;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Sedang offline</h1>
      <p>
        Papan Anda butuh sambungan untuk dimuat. Perubahan yang sempat tersimpan tetap aman —
        coba lagi begitu jaringan kembali.
      </p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
